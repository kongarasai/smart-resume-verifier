name: Selenium E2E Tests & Excel Report Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  selenium-e2e-testing:
    name: Run Selenium E2E Tests & Generate Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome Browser
        uses: browser-actions/setup-chrome@v1

      - name: Install Selenium Test Suite Dependencies
        working-directory: ./selenium-tests
        run: npm install

      - name: Run Selenium E2E Tests
        continue-on-error: true
        working-directory: ./selenium-tests
        run: npm test
        env:
          BASE_URL: http://localhost:3000

      - name: Generate Excel Test Summary & Details Report
        if: always()
        working-directory: ./selenium-tests
        run: node generate-report.js

      - name: Upload Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_E2E_Test_Report
          path: ./selenium-tests/Test_Summary_and_Details_Report.xlsx
          retention-days: 30
