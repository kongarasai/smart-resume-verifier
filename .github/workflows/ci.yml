name: Smart Resume Verifier CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Node.js environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x' # Adjust this to your project's Node version

    # 3. Install Backend Dependencies
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm install

    # 4. Install Frontend Dependencies
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    # 5. Build Frontend (Next.js)
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    # 6. Install Selenium E2E Testing Dependencies
    - name: Install Selenium E2E Dependencies
      working-directory: ./selenium-tests
      run: npm install

    # 7. Start Services for E2E Testing
    - name: Start Backend and Frontend Servers
      run: |
        cd backend && npm start &
        cd frontend && npm start &
        sleep 15
        
    # 8. Run Selenium E2E Tests
    - name: Run Selenium E2E Tests
      working-directory: ./selenium-tests
      run: xvfb-run --auto-servernum npm run test || true

    # 9. Generate Excel Summary & Detailed Report
    - name: Generate Excel Test Report
      if: always()
      working-directory: ./selenium-tests
      run: node generate-report.js

    # 10. Upload Test Report Artifact
    - name: Upload Excel Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Selenium_E2E_Test_Execution_Report
        path: ./selenium-tests/Test_Summary_and_Details_Report.xlsx

